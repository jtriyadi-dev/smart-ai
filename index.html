<!doctype html>
<html lang="id" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>SMART-AI.ID | Jasa Pembuatan Aplikasi Web Berbasis AI & Custom Software</title>
    <meta name="description" content="SMART-AI.ID membantu bisnis membangun aplikasi web custom berbasis AI, sistem informasi, dashboard bisnis, automation, dan solusi digital untuk berbagai industri." />
    <meta name="keywords" content="aplikasi berbasis AI, jasa pembuatan aplikasi, jasa pembuatan website, pengembangan aplikasi web, aplikasi AI Indonesia, software development Indonesia, custom software, AI application development, aplikasi perusahaan, sistem informasi perusahaan" />
    
    <meta property="og:title" content="SMART-AI.ID | Jasa Pembuatan Aplikasi Web Berbasis AI" />
    <meta property="og:description" content="Sistem Informasi Enterprise, AI Business Automation, Dashboard Analytics & Custom AI Software Development di Indonesia." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.smart-ai.id" />
    <link rel="canonical" href="https://www.smart-ai.id" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA Manifest & App Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#07090e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SMART-AI.ID" />
    <meta name="application-name" content="SMART-AI.ID" />
    <meta name="msapplication-TileColor" content="#07090e" />
    <meta name="msapplication-navbutton-color" content="#07090e" />
    
    <!-- PWA App Icons & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#07090e] text-slate-100 font-sans antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root">
      <div id="loading-fallback" style="min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #07090e; color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box;">
        <div style="position: relative; width: 48px; height: 48px; margin-bottom: 20px;">
          <div style="width: 48px; height: 48px; border: 3px solid rgba(56, 189, 248, 0.15); border-top-color: #00d2fe; border-radius: 50%; animation: smartai-spin 0.75s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
            <div style="width: 8px; height: 8px; background: #00d2fe; border-radius: 50%; box-shadow: 0 0 10px #00d2fe;"></div>
          </div>
        </div>
        <div style="font-size: 18px; font-weight: 800; letter-spacing: 0.04em; color: #ffffff; margin-bottom: 4px;">SMART-AI.ID</div>
        <div id="loading-text" style="font-size: 13px; color: #94a3b8; margin-bottom: 16px;">Memuat sistem...</div>
        
        <!-- Auto Recovery Button (Appears if network or mobile cache hangs) -->
        <div id="loading-recovery" style="display: none; max-width: 320px; width: 100%;">
          <p style="font-size: 12px; color: #cbd5e1; margin-bottom: 12px; line-height: 1.4;">Koneksi memerlukan pembaruan cache atau sedang menyiapkan modul.</p>
          <button id="btn-force-reload" onclick="forceReloadApp()" style="width: 100%; padding: 10px 16px; border-radius: 12px; background: linear-gradient(135deg, #00d2fe, #2563eb); border: none; color: #ffffff; font-weight: 600; font-size: 13px; cursor: pointer; box-shadow: 0 4px 14px rgba(0, 210, 254, 0.25);">
            Buka Aplikasi Sekarang
          </button>
        </div>
      </div>
      <style>
        @keyframes smartai-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>

    <!-- Self-Healing Watcher for Mobile Browsers & Stale Service Workers -->
    <script>
      function forceReloadApp() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
          });
        }
        var url = new URL(window.location.href);
        url.searchParams.set('_r', Date.now());
        window.location.replace(url.toString());
      }

      // If React doesn't replace #loading-fallback within 3.5 seconds, show the manual action button
      setTimeout(function() {
        var fb = document.getElementById('loading-fallback');
        var rec = document.getElementById('loading-recovery');
        var txt = document.getElementById('loading-text');
        if (fb && rec) {
          rec.style.display = 'block';
          if (txt) txt.textContent = 'Menyiapkan modul aplikasi...';
        }
      }, 3500);

      // Catch global startup errors
      window.addEventListener('error', function(e) {
        console.warn('[SMART-AI Bootstrap Error]', e);
        var rec = document.getElementById('loading-recovery');
        var txt = document.getElementById('loading-text');
        if (rec) rec.style.display = 'block';
        if (txt) txt.textContent = 'Mengoptimalkan koneksi...';
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
